# Local review only: five worker processes and the coordinator share one host.
services:
  nginx:
    volumes:
      - ../runtime/review/route:/etc/nginx/runtime:ro
  workbench:
    build:
      context: ..
      dockerfile: deploy/Dockerfile.agent
    user: "0:0"
    init: true
    command: [python, /srv/deploy/review_entry.py]
    ports: ["127.0.0.1:${WORKBENCH_PORT:-18766}:8765"]
    volumes:
      - ../runtime/review:/review
      - review-state:/state
      - /var/run/docker.sock:/var/run/docker.sock
    depends_on:
      postgres: {condition: service_healthy}
      app-v2: {condition: service_healthy}
      nginx: {condition: service_started}
    healthcheck:
      test: [CMD, python, -c, "import json,urllib.request; s=json.load(urllib.request.urlopen('http://127.0.0.1:8766/api/state')); assert s['connected'] and len(s['participants']) == 5"]
      interval: 5s
      timeout: 4s
      retries: 24
    labels: {incident-pilot: "true", incident-pilot.domain: review}
  review-ui:
    image: nginx:1.27-alpine
    network_mode: service:workbench
    volumes:
      - ./review-proxy.conf:/etc/nginx/conf.d/default.conf:ro
    depends_on:
      workbench: {condition: service_healthy}
volumes:
  review-state:
