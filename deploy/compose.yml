name: incident-pilot

x-app: &app
  build:
    context: ..
    dockerfile: business/order_app/Dockerfile
  restart: unless-stopped
  depends_on:
    postgres:
      condition: service_healthy
  environment: &app-env
    PGHOST: postgres
    PGPORT: "5432"
    PGDATABASE: orders
    PGUSER: orders_app
    PGPASSWORD: ${ORDERS_DB_PASSWORD:?Set ORDERS_DB_PASSWORD in the application domain}
    APP_ADMIN_TOKEN: ${APP_ADMIN_TOKEN:?Set APP_ADMIN_TOKEN in the application domain}
    DB_COMMAND_TIMEOUT: "3"
  healthcheck:
    test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/ready', timeout=3)"]
    interval: 10s
    timeout: 4s
    retries: 6

services:
  postgres:
    image: postgres:16-alpine
    restart: unless-stopped
    environment:
      POSTGRES_DB: orders
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set the database-domain admin password}
      ORDERS_DB_PASSWORD: ${ORDERS_DB_PASSWORD:?Set application-domain database password}
      BRIDGE_DB_PASSWORD: ${BRIDGE_DB_PASSWORD:-}
    volumes:
      - orders-data:/var/lib/postgresql/data
      - ./postgres/init.sh:/docker-entrypoint-initdb.d/10-orders.sh:ro
      - ../business/order_app/schema.sql:/schema/orders.sql:ro
      - ../domains/database/bootstrap.sql:/schema/bridge.sql:ro
    labels:
      incident-pilot: "true"
      incident-pilot.domain: database
    healthcheck:
      test: [CMD-SHELL, "pg_isready -U postgres -d orders"]
      interval: 5s
      timeout: 3s
      retries: 12

  app-v1:
    <<: *app
    environment:
      <<: *app-env
      APP_VERSION: v1
    ports: ["127.0.0.1:${APP_V1_PORT:-8081}:8000"]
    labels:
      incident-pilot: "true"
      incident-pilot.domain: application

  app-v2:
    <<: *app
    environment:
      <<: *app-env
      APP_VERSION: v2
    ports: ["127.0.0.1:${APP_V2_PORT:-8082}:8000"]
    labels:
      incident-pilot: "true"
      incident-pilot.domain: application

  nginx:
    image: nginx:1.27-alpine
    restart: unless-stopped
    ports: ["${ORDER_BIND:-127.0.0.1}:${ORDER_PORT:-8088}:80"]
    volumes:
      - ./nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./nginx/runtime:/etc/nginx/runtime:ro
    depends_on:
      app-v2:
        condition: service_healthy
      app-v1:
        condition: service_healthy
    labels:
      incident-pilot: "true"
      incident-pilot.domain: operations

  reply-drop:
    <<: *app
    profiles: [faults]
    command: [python, -m, business.fault_reply_proxy]
    ports: ["127.0.0.1:${REPLY_DROP_PORT:-8090}:8090"]
    environment:
      FAULT_UPSTREAM: http://app-v2:8000
      FAULT_REPLY_DELAY: "60"
    healthcheck:
      disable: true
    labels:
      incident-pilot: "true"
      incident-pilot.domain: evaluation

  fault-locker:
    <<: *app
    profiles: [faults]
    command: [python, -m, business.fault_lock]
    restart: "no"
    environment:
      PGHOST: postgres
      PGDATABASE: orders
      PGUSER: orders_app
      PGPASSWORD: ${ORDERS_DB_PASSWORD:?Set the application-domain experiment password}
    healthcheck:
      disable: true
    labels:
      incident-pilot: "true"
      incident-pilot.domain: evaluation

volumes:
  orders-data:
    labels:
      incident-pilot: "true"
