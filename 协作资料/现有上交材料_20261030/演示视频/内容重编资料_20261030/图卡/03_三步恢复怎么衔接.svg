<rect x="76" y="778" width="1768" height="138" rx="20" fill="#E6F2F6" stroke="none" stroke-width="2"/>
<text x="110" y="811" font-family="Microsoft YaHei, sans-serif" font-size="39" font-weight="700" dominant-baseline="text-before-edge" fill="#087D9A">修改后复查状态，再验证订单流程。</text>
<text x="112" y="870" font-family="Microsoft YaHei, sans-serif" font-size="27" font-weight="400" dominant-baseline="text-before-edge" fill="#5B7382">录制时，审批按钮由授权脚本点击。</text>
