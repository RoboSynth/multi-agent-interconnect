<rect x="76" y="390" width="548" height="280" rx="20" fill="#FFFFFF" stroke="#C8DAE3" stroke-width="2"/>
<text x="104" y="420" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" dominant-baseline="text-before-edge" fill="#087D9A">1  恢复正确入口</text>
<text x="104" y="488" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">运维智能体</text>
