<rect x="686" y="390" width="548" height="280" rx="20" fill="#FFFFFF" stroke="#C8DAE3" stroke-width="2"/>
<text x="714" y="420" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" dominant-baseline="text-before-edge" fill="#087D9A">2  获批后恢复写入</text>
<text x="714" y="488" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">数据库智能体</text>
<text x="714" y="537" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">将应用账号的只读状态解除</text>
<rect x="1296" y="390" width="548" height="280" rx="20" fill="#FFFFFF" stroke="#C8DAE3" stroke-width="2"/>
<text x="1324" y="420" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" dominant-baseline="text-before-edge" fill="#087D9A">3  重建应用连接池</text>
<text x="1324" y="488" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">应用智能体</text>
<text x="1324" y="537" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">让新连接采用恢复后的状态</text>
