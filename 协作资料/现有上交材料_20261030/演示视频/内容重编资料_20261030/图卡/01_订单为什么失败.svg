<svg xmlns="http://www.w3.org/2000/svg" width="1920" height="1080" viewBox="0 0 1920 1080">
<rect width="1920" height="1080" fill="#F2F7FA"/>
<rect x="76" y="64" width="430" height="48" rx="9" fill="#E6F2F6" stroke="none" stroke-width="2"/>
<text x="96" y="75" font-family="Microsoft YaHei, sans-serif" font-size="24" font-weight="700" dominant-baseline="text-before-edge" fill="#087D9A">联枢  /  示意图</text>
<text x="76" y="152" font-family="Microsoft YaHei, sans-serif" font-size="54" font-weight="700" dominant-baseline="text-before-edge" fill="#19394B">一笔订单，遇到两个故障</text>
<text x="78" y="239" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" dominant-baseline="text-before-edge" fill="#5B7382">演示设置：入口错指旧版本，数据库应用账号只读</text>
<line x1="76" y1="994" x2="1844" y2="994" stroke="#C8DAE3" stroke-width="3"/>
<text x="78" y="1021" font-family="Microsoft YaHei, sans-serif" font-size="23" font-weight="400" dominant-baseline="text-before-edge" fill="#5B7382">内容依据 2026年10月29日采集记录  ·  资料整理 2026年10月30日</text>
<rect x="76" y="385" width="418" height="220" rx="20" fill="#FFFFFF" stroke="#C8DAE3" stroke-width="2"/>
<text x="104" y="415" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" dominant-baseline="text-before-edge" fill="#087D9A">提交订单</text>
<text x="104" y="483" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">用户请求进入系统</text>
<rect x="526" y="385" width="418" height="220" rx="20" fill="#FFFFFF" stroke="#C8DAE3" stroke-width="2"/>
<text x="554" y="415" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" dominant-baseline="text-before-edge" fill="#B74343">订单入口</text>
<text x="554" y="483" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">仍指向旧版本</text>
<rect x="976" y="385" width="418" height="220" rx="20" fill="#FFFFFF" stroke="#C8DAE3" stroke-width="2"/>
<text x="1004" y="415" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" dominant-baseline="text-before-edge" fill="#087D9A">应用服务</text>
<text x="1004" y="483" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">接收订单请求</text>
<rect x="1426" y="385" width="418" height="220" rx="20" fill="#FFFFFF" stroke="#C8DAE3" stroke-width="2"/>
<text x="1454" y="415" font-family="Microsoft YaHei, sans-serif" font-size="34" font-weight="700" dominant-baseline="text-before-edge" fill="#B74343">数据库</text>
<text x="1454" y="483" font-family="Microsoft YaHei, sans-serif" font-size="29" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">应用账号无法写入</text>
<line x1="494" y1="494" x2="526" y2="494" stroke="#087D9A" stroke-width="4"/>
<polygon points="526,494 512,485 512,503" fill="#087D9A"/>
<line x1="944" y1="494" x2="976" y2="494" stroke="#087D9A" stroke-width="4"/>
<polygon points="976,494 962,485 962,503" fill="#087D9A"/>
<line x1="1394" y1="494" x2="1426" y2="494" stroke="#087D9A" stroke-width="4"/>
<polygon points="1426,494 1412,485 1412,503" fill="#087D9A"/>
<rect x="76" y="716" width="1768" height="166" rx="20" fill="#FAECEA" stroke="none" stroke-width="2"/>
<text x="110" y="749" font-family="Microsoft YaHei, sans-serif" font-size="40" font-weight="700" dominant-baseline="text-before-edge" fill="#B74343">恢复入口后，继续恢复数据库写入。</text>
<text x="112" y="815" font-family="Microsoft YaHei, sans-serif" font-size="30" font-weight="400" dominant-baseline="text-before-edge" fill="#19394B">再更新应用连接，创建、查询并取消订单。</text>
</svg>