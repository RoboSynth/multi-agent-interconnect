<rect x="106" y="568" width="780" height="76" rx="18" fill="#FAECEA"/>
<text x="130" y="587" font-family="Microsoft YaHei,sans-serif" font-size="33" dominant-baseline="text-before-edge" font-weight="700" fill="#B74343">拒绝执行  ·  数据库没有被改动</text>
<rect x="994" y="338" width="850" height="338" rx="18" fill="#FFFFFF"/>
<text x="1024" y="372" font-family="Microsoft YaHei,sans-serif" font-size="37" dominant-baseline="text-before-edge" font-weight="700" fill="#087D9A">例子二  拿过期的批准继续修改</text>
<text x="1024" y="444" font-family="Microsoft YaHei,sans-serif" font-size="34" dominant-baseline="text-before-edge" font-weight="400" fill="#19394B">请求：修改数据库</text>
<text x="1024" y="502" font-family="Microsoft YaHei,sans-serif" font-size="31" dominant-baseline="text-before-edge" font-weight="400" fill="#5B7382">原来的批准已经过期</text>
<rect x="1024" y="568" width="780" height="76" rx="18" fill="#FAECEA"/>
<text x="1048" y="587" font-family="Microsoft YaHei,sans-serif" font-size="33" dominant-baseline="text-before-edge" font-weight="700" fill="#B74343">拒绝执行  ·  数据库没有被改动</text>
<rect x="76" y="758" width="1768" height="166" rx="18" fill="#E6F2F6"/>
<text x="110" y="786" font-family="Microsoft YaHei,sans-serif" font-size="31" dominant-baseline="text-before-edge" font-weight="700" fill="#087D9A">本地检查结果</text>
<text x="110" y="845" font-family="Microsoft YaHei,sans-serif" font-size="43" dominant-baseline="text-before-edge" font-weight="700" fill="#19394B">14 项违规请求被拒绝     1 项合法请求放行</text>
<text x="78" y="988" font-family="Microsoft YaHei,sans-serif" font-size="26" dominant-baseline="text-before-edge" font-weight="400" fill="#5B7382">依据：2026年10月29日本地检查记录；被拒绝的请求均未进入工具执行。</text>
